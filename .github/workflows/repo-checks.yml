name: repo-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo rules (metas, asmdef boundaries, LFS, agent docs)
        run: python tools/check_repo.py
