<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Baloo 2','Fredoka',sans-serif" font-weight="800">
  <rect width="1000" height="420" fill="#FFC8DD"/>
  <g stroke="#1F2340" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 1. Hazard banner -->
    <rect x="60" y="40" width="720" height="86" rx="43" fill="#1F2340"/>
    <path d="M110 108 L140 56 L170 108 Z" fill="#FFB703" stroke="#FFB703"/>
    <path d="M140 74 V92" stroke="#1F2340"/><circle cx="140" cy="100" r="1" stroke="#1F2340"/>
    <text x="195" y="98" font-size="44" fill="#FFB703" stroke="none">CANNON FIRES IN 2s</text>
    <!-- 2. Dash icon with cooldown ring (≈60% charged) -->
    <circle cx="150" cy="290" r="64" fill="#A8E6CF"/>
    <circle cx="150" cy="290" r="64" fill="none" stroke="#FFB703" stroke-width="12" stroke-dasharray="241 402" transform="rotate(-90 150 290)"/>
    <path d="M118 290 H178 M158 266 L182 290 L158 314" fill="none" stroke="#1F2340" stroke-width="9"/>
    <text x="150" y="400" font-size="26" fill="#1F2340" stroke="none" text-anchor="middle">DASH · 1.2s</text>
    <!-- 3. Key hints -->
    <rect x="360" y="246" width="150" height="76" rx="18" fill="#FFE8D6"/>
    <text x="435" y="298" font-size="38" fill="#1F2340" stroke="none" text-anchor="middle">Space</text>
    <text x="435" y="354" font-size="26" fill="#1F2340" stroke="none" text-anchor="middle">JUMP</text>
    <rect x="560" y="246" width="150" height="76" rx="18" fill="#FFE8D6"/>
    <text x="635" y="298" font-size="38" fill="#1F2340" stroke="none" text-anchor="middle">Shift</text>
    <text x="635" y="354" font-size="26" fill="#1F2340" stroke="none" text-anchor="middle">DASH</text>
  </g>
